<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>UI 모션 라이브러리</title>
<style>
:root{
  --bg:#f5f6f8; --stage:#eef1f5; --surface:#ffffff; --surface-2:#f1f3f6;
  --text:#14171c; --muted:#6b7380; --line:#e3e6eb;
  --accent:#2f6bff; --accent-soft:#e3ecff; --accent-text:#ffffff;
  --danger:#f0443a; --success:#16a36a; --warn:#f59e0b;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.08);
  --card:#ffffff; --card-line:#e6e9ee; --chip:#ffffff; --code:#f6f7f9;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013; --stage:#171a1f; --surface:#22262d; --surface-2:#2a2f37;
    --text:#eef0f3; --muted:#9aa3b0; --line:#343a43;
    --accent:#5b8cff; --accent-soft:#1f2c4d; --accent-text:#ffffff;
    --danger:#ff6259; --success:#2fc488; --warn:#fbbf24;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
    --card:#15181c; --card-line:#262b32; --chip:#1b1f24; --code:#1b1f25;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1013; --stage:#171a1f; --surface:#22262d; --surface-2:#2a2f37;
  --text:#eef0f3; --muted:#9aa3b0; --line:#343a43;
  --accent:#5b8cff; --accent-soft:#1f2c4d; --accent-text:#ffffff;
  --danger:#ff6259; --success:#2fc488; --warn:#fbbf24;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
  --card:#15181c; --card-line:#262b32; --chip:#1b1f24; --code:#1b1f25;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Pretendard,"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.u-wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* hero */
.u-hero{padding-top:56px;padding-bottom:28px}
.u-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:999px}
.u-hero h1{font-size:clamp(30px,5vw,48px);line-height:1.15;letter-spacing:-.03em;margin:18px 0 12px;font-weight:800}
.u-hero h1 em{font-style:normal;color:var(--accent)}
.u-hero p.lead{color:var(--muted);font-size:16px;max-width:620px;margin:0}
.u-how{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;padding:0;list-style:none}
.u-how li{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--card-line);border-radius:12px;padding:9px 14px;font-size:14px}
.u-how b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px}

/* toolbar */
.u-bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--card-line)}
.u-bar .u-wrap{display:flex;flex-direction:column;gap:10px;padding-top:12px;padding-bottom:12px}
.u-row1{display:flex;gap:10px;align-items:center}
.u-search{flex:1;position:relative}
.u-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.u-search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--card-line);background:var(--card);color:var(--text);padding:0 40px 0 42px;font:inherit;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
.u-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.u-search .u-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:8px;display:none}
.u-search.u-has .u-clear{display:block}
.u-iconbtn{height:44px;min-width:44px;border-radius:12px;border:1px solid var(--card-line);background:var(--card);cursor:pointer;display:grid;place-items:center;color:var(--text)}
.u-iconbtn:hover{border-color:var(--accent)}
.u-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.u-chips::-webkit-scrollbar{display:none}
.u-chip{flex:none;border:1px solid var(--card-line);background:var(--chip);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .2s}
.u-chip span{opacity:.6;margin-left:4px;font-weight:500}
.u-chip:hover{color:var(--text)}
.u-chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

/* sections & cards */
main{padding:8px 0 80px}
section.u-cat{padding-top:36px;scroll-margin-top:120px}
section.u-cat[hidden]{display:none}
.u-cat-head{display:flex;align-items:baseline;gap:10px;margin:0 0 16px}
.u-cat-head h2{font-size:22px;letter-spacing:-.02em;margin:0;font-weight:800}
.u-cat-head small{color:var(--muted);font-size:14px}
.u-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.u-card{background:var(--card);border:1px solid var(--card-line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .25s,transform .25s}
.u-card:hover{box-shadow:var(--shadow)}
.u-card[hidden]{display:none}
.u-card.u-flash{animation:u-flash-k 1.2s ease-out}
@keyframes u-flash-k{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.u-stagewrap{position:relative;margin:8px 8px 0}
.stage{position:relative;height:200px;overflow:hidden;display:grid;place-items:center;background:var(--stage);border-radius:12px;isolation:isolate;color:var(--text)}
.u-replay{position:absolute;right:8px;top:8px;z-index:5;width:30px;height:30px;border-radius:9px;border:1px solid var(--card-line);background:color-mix(in srgb,var(--card) 85%,transparent);cursor:pointer;display:grid;place-items:center;color:var(--muted);opacity:.0;transition:opacity .2s,color .2s}
.u-card:hover .u-replay,.u-replay:focus-visible{opacity:1}
@media (hover:none){.u-replay{opacity:1}}
.u-replay:hover{color:var(--accent)}
.u-replay.u-spin svg{animation:u-spin-k .5s ease-out}
@keyframes u-spin-k{to{transform:rotate(360deg)}}
.u-meta{padding:14px 16px 0}
.u-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.u-num{font-size:12px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.u-title h3{margin:0;font-size:17px;letter-spacing:-.02em;font-weight:700}
.u-en{color:var(--muted);font-size:13px}
.u-pair{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;background:var(--accent-soft);padding:4px 10px;border-radius:999px}
.u-pair:hover{filter:brightness(.97)}
.u-pair b{font-weight:800}
.u-desc{margin:6px 0 0;color:var(--muted);font-size:13.5px;line-height:1.55}
.u-prompt{margin:12px 16px 16px;background:var(--code);border:1px solid var(--card-line);border-radius:12px;padding:10px 10px 10px 12px;display:flex;gap:8px;align-items:flex-start;margin-top:auto}
.u-meta + .u-prompt{margin-top:12px}
.u-prompt p{margin:0;font-size:12.5px;line-height:1.6;color:var(--text);opacity:.86;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.u-prompt.u-open p{-webkit-line-clamp:unset}
.u-copy{flex:none;border:0;background:var(--accent);color:#fff;border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:transform .15s,background .2s}
.u-copy:active{transform:scale(.95)}
.u-copy.u-done{background:var(--success)}
.cardfoot{height:0}
.u-empty{display:none;text-align:center;color:var(--muted);padding:80px 0}
.u-empty.u-show{display:block}

/* toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#14171c;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.2,1);z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.u-show{opacity:1;transform:translate(-50%,0)}
footer{border-top:1px solid var(--card-line);color:var(--muted);font-size:13px;padding:24px 0 40px}

/* shared demo utilities */
.ui-phone{width:220px;height:180px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;position:relative}
.ui-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-text);font-weight:700;font-size:13px;cursor:pointer}
.ui-chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--text)}
.ui-line{height:8px;border-radius:4px;background:var(--line)}
.ui-thumb{border-radius:10px;background:var(--accent-soft)}

@media (max-width:640px){
  .u-wrap{padding:0 16px}
  .u-hero{padding-top:36px;padding-bottom:18px}
  .u-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ .u-card,.u-chip,#toast{transition:none} }
.u-hero{position:relative}
.u-logo{position:absolute;right:20px;top:52px;display:block;line-height:0}
.u-logo img{height:48px;width:auto;display:block}
.u-logo .lg-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .u-logo .lg-l{display:none}:root:not([data-theme="light"]) .u-logo .lg-d{display:block}}
:root[data-theme="dark"] .u-logo .lg-l{display:none}
:root[data-theme="dark"] .u-logo .lg-d{display:block}
@media (max-width:640px){.u-logo{right:16px;top:34px}.u-logo img{height:32px}}
</style>
<script>
window.UIDEX={cats:{},add(cat,list){(this.cats[cat]=this.cats[cat]||[]).push(...list)}};
</script>

<script>
(function(){
const CATS=[
  ['progress','진행·상태'],['commerce','가격·혜택'],['action','버튼·반응'],['input','입력·선택'],['search','검색'],
  ['layout','목록·레이아웃'],['nav','내비게이션'],['feedback','피드백·알림'],['motion','모션·스크롤'],['style','글자·효과']
];
const main=document.getElementById('main'), chipsEl=document.getElementById('chips');
const styleEl=document.createElement('style'); let css='';
const cards=[]; let n=0;

function makeCtx(){
  let alive=true; const tos=[],ivs=[],rafs=new Set(),offs=[];
  return {
    get alive(){return alive},
    timeout(f,ms){const id=setTimeout(()=>{if(alive)try{f()}catch(e){console.error(e)}},ms);tos.push(id);return id},
    interval(f,ms){const id=setInterval(()=>{if(alive)try{f()}catch(e){console.error(e)}},ms);ivs.push(id);return id},
    raf(f){const id=requestAnimationFrame(t=>{rafs.delete(id);if(alive)try{f(t)}catch(e){console.error(e)}});rafs.add(id);return id},
    loop(f){const s=performance.now();const step=now=>{if(!alive)return;let r;try{r=f(now-s)}catch(e){console.error(e);return}if(r===false)return;const id=requestAnimationFrame(step);rafs.add(id)};const id=requestAnimationFrame(step);rafs.add(id)},
    on(t,ev,fn,opt){t.addEventListener(ev,fn,opt);offs.push(()=>t.removeEventListener(ev,fn,opt))},
    dispose(){alive=false;tos.forEach(clearTimeout);ivs.forEach(clearInterval);rafs.forEach(cancelAnimationFrame);offs.forEach(f=>f());}
  };
}
function play(c){
  stop(c);
  const ctx=makeCtx(); c.ctx=ctx;
  try{ c.stage.innerHTML=c.d.html||''; if(typeof c.d.run==='function') c.d.run(c.stage,ctx); }
  catch(e){ console.error('[demo '+c.d.id+']',e); }
}
function stop(c){ if(c.ctx){c.ctx.dispose();c.ctx=null;} }

const ICON_REPLAY='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>';
const ICON_COPY='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

CATS.forEach(([key,label])=>{
  const list=(UIDEX.cats[key]||[]);
  const sec=document.createElement('section'); sec.className='u-cat'; sec.id='cat-'+key; sec.dataset.cat=key;
  sec.innerHTML='<div class="u-cat-head"><h2>'+label+'</h2><small>'+list.length+'개</small></div><div class="u-grid"></div>';
  const grid=sec.querySelector('.u-grid');
  list.forEach(d=>{
    n++; css+=(d.css||'')+'\n';
    const el=document.createElement('article'); el.className='u-card'; el.id=d.id; el.dataset.cat=key;
    el.innerHTML='<div class="u-stagewrap"><div class="stage d-'+d.id+'" aria-label="'+esc(d.ko)+' 데모"></div><button class="u-replay" type="button" aria-label="다시 재생" title="다시 재생">'+ICON_REPLAY+'</button></div>'+
      '<div class="u-meta"><div class="u-title"><span class="u-num">'+String(n).padStart(3,'0')+'</span><h3>'+esc(d.ko)+'</h3><span class="u-en">'+esc(d.en)+'</span></div><p class="u-desc">'+esc(d.desc||'')+'</p>'+(d.pair?'<a class="u-pair" href="#'+esc(d.pair)+'" data-pair="'+esc(d.pair)+'">헷갈리는 짝 <b></b> →</a>':'')+'</div>'+
      '<div class="u-prompt"><p title="눌러서 펼치기">'+esc(d.prompt||'')+'</p><button class="u-copy" type="button" aria-label="'+esc(d.ko)+' 프롬프트 복사">'+ICON_COPY+'<span>복사</span></button></div>';
    const c={d,el,stage:el.querySelector('.stage'),ctx:null,text:(d.ko+' '+d.en+' '+(d.desc||'')+' '+(d.prompt||'')+' '+label).toLowerCase()};
    cards.push(c); el._c=c;
    el.querySelector('.u-replay').addEventListener('click',e=>{const b=e.currentTarget;b.classList.remove('u-spin');void b.offsetWidth;b.classList.add('u-spin');play(c)});
    el.querySelector('.u-copy').addEventListener('click',e=>copy(d.prompt,e.currentTarget));
    el.querySelector('.u-prompt p').addEventListener('click',e=>e.currentTarget.parentNode.classList.toggle('u-open'));
    grid.appendChild(el);
  });
  main.appendChild(sec);
});
styleEl.textContent=css; document.head.appendChild(styleEl);
document.getElementById('eyebrow').textContent='UI 모션 라이브러리 · '+cards.length;
document.querySelectorAll('.u-pair').forEach(a=>{const t=cards.find(c=>c.d.id===a.dataset.pair);if(!t){a.remove();return}a.querySelector('b').textContent=t.d.ko;
  a.addEventListener('click',e=>{e.preventDefault();if(t.el.hidden){q.value='';curCat='all';[...chipsEl.children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.cat==='all'));apply()}t.el.scrollIntoView({behavior:'smooth',block:'center'});t.el.classList.remove('u-flash');void t.el.offsetWidth;t.el.classList.add('u-flash');history.replaceState(null,'','#'+t.d.id)})});

/* chips */
let curCat='all';
function chip(key,label,count){const b=document.createElement('button');b.className='u-chip';b.type='button';b.dataset.cat=key;b.setAttribute('aria-pressed',key==='all');b.innerHTML=label+'<span>'+count+'</span>';b.onclick=()=>{curCat=key;[...chipsEl.children].forEach(x=>x.setAttribute('aria-pressed',x===b));apply();window.scrollTo({top:document.querySelector('.u-bar').offsetTop,behavior:'smooth'})};chipsEl.appendChild(b)}
chip('all','전체',cards.length);
CATS.forEach(([k,l])=>chip(k,l,(UIDEX.cats[k]||[]).length));

/* search */
const q=document.getElementById('q'), box=document.getElementById('searchBox');
function apply(){
  const term=q.value.trim().toLowerCase(); box.classList.toggle('u-has',!!term);
  const terms=term.split(/\s+/).filter(Boolean); let shown=0;
  document.querySelectorAll('section.u-cat').forEach(sec=>{
    let any=0;
    sec.querySelectorAll('.u-card').forEach(el=>{
      const c=el._c; const ok=(curCat==='all'||curCat===sec.dataset.cat)&&terms.every(t=>c.text.includes(t));
      el.hidden=!ok; if(ok){any++;shown++} else stop(c);
    });
    sec.hidden=!any;
  });
  document.getElementById('empty').classList.toggle('u-show',!shown);
}
q.addEventListener('input',apply);
box.querySelector('.u-clear').addEventListener('click',()=>{q.value='';apply();q.focus()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}});

/* copy */
const toast=document.getElementById('toast'); let tt;
function showToast(m){toast.textContent=m;toast.classList.add('u-show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('u-show'),1600)}
function copy(text,btn){
  const ok=()=>{btn.classList.add('u-done');btn.querySelector('span').textContent='완료';showToast('프롬프트를 복사했어요');setTimeout(()=>{btn.classList.remove('u-done');btn.querySelector('span').textContent='복사'},1500)};
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();let s=false;try{s=document.execCommand('copy')}catch(e){}ta.remove();s?ok():showToast('복사에 실패했어요. 문장을 길게 눌러 직접 복사해 주세요')};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok,fallback)}else fallback();
}

/* theme */
const root=document.documentElement;
try{const t=localStorage.getItem('uidex-theme');if(t)root.dataset.theme=t}catch(e){}
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme=dark?'light':'dark'; try{localStorage.setItem('uidex-theme',root.dataset.theme)}catch(e){}
});

/* autoplay on view */
const io=new IntersectionObserver(es=>es.forEach(en=>{const c=en.target._c;if(en.isIntersecting){if(!c.ctx)play(c)}else stop(c)}),{threshold:.35});
cards.forEach(c=>io.observe(c.el));

/* deep link #id */
if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t&&t.classList.contains('u-card')){setTimeout(()=>{t.scrollIntoView({block:'center'});t.classList.add('u-flash')},50)}}
window.__UIDEX_TEST={cards,play,stop};
})();
</script>
